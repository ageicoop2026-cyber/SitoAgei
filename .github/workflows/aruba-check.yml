name: Verifica connessione Aruba
on:
  workflow_dispatch:
permissions: {}
jobs:
  verifica-ftps:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Verifica accesso FTPS senza modificare file
        env:
          ARUBA_FTP_USERNAME: ${{ secrets.ARUBA_FTP_USERNAME }}
          ARUBA_FTP_PASSWORD: ${{ secrets.ARUBA_FTP_PASSWORD }}
        run: |
          python3 - <<'PY'
          import ftplib
          import os
          import ssl
          import socket
          import sys

          class ImplicitFTP_TLS(ftplib.FTP_TLS):
              def connect(self, host, port=990):
                  self.host = host
                  self.port = port
                  raw_socket = socket.create_connection((host, port), self.timeout)
                  self.af = raw_socket.family
                  try:
                      self.sock = self.context.wrap_socket(raw_socket, server_hostname=host)
                  except Exception:
                      raw_socket.close()
                      raise
                  self.file = self.sock.makefile("r", encoding=self.encoding)
                  self.welcome = self.getresp()
                  return self.welcome

          username = os.environ.get("ARUBA_FTP_USERNAME", "")
          password = os.environ.get("ARUBA_FTP_PASSWORD", "")
          if not username or not password:
              sys.exit("Aggiungere i secrets ARUBA_FTP_USERNAME e ARUBA_FTP_PASSWORD.")
          try:
              with ImplicitFTP_TLS(context=ssl.create_default_context(), timeout=30) as ftp:
                  ftp.connect("ftplnx.agei.it", 990)
                  ftp.login(username, password)
                  ftp.prot_p()
                  ftp.set_pasv(True)
                  ftp.cwd("/")
                  # Read the listing to verify the protected data connection.
                  # Do not print names or contents of remote files.
                  ftp.nlst()
                  ftp.quit()
              print("Connessione FTPS e lettura della cartella / riuscite. Nessun file modificato.")
          except ssl.SSLCertVerificationError as error:
              print("Certificato TLS non valido: " + error.verify_message)
              sys.exit(1)
          except Exception as error:
              print("Verifica non riuscita (" + type(error).__name__ + "). Controllare credenziali, certificato e filtro FTP Aruba.")
              sys.exit(1)
          PY
